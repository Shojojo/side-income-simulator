          <p>FIREの目標資産は、年間生活費の25年分をひとつの目安として考えられます。ただし住居費、家族構成、社会保険、税金によって必要額は変わります。</p>

          <p>想定年利は将来を保証するものではありません。3%、4%、5%など複数の条件で試すと、積立額や年数を変えたときの影響が見えやすくなります。</p>
